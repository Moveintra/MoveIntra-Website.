<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MoveIntra Logistics</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: var(--bg-canvas);">
    <div class="auth-card my-5">
        <div class="auth-header text-center mb-4">
            <a href="index.html"
                class="logo d-flex align-items-center justify-content-center mb-4 text-decoration-none">
                <i class="fas fa-shipping-fast text-primary me-2 fs-2"></i>
                <span class="fs-3 fw-bold text-dark">MoveIntra</span>
            </a>
            <h2 class="h3 fw-bold">Create Account</h2>
            <p class="text-muted">Join the fastest logistics network</p>
        </div>
        <form class="auth-form" action="dashboard.html" method="get">
            <div class="form-group mb-3">
                <label>Full Name</label>
                <input type="text" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group mb-3">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="form-group mb-3">
                <label>Phone Number</label>
                <input type="tel" class="form-control" placeholder="+91 9876543210" required>
            </div>
            <div class="form-group mb-4">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Sign Up</button>
        </form>
        <div class="auth-footer text-center mt-4">
            <p class="mb-0">Already have an account? <a href="login.html"
                    class="text-primary fw-bold text-decoration-none">Login</a></p>
        </div>
    </div>
</body>

</html>
